services:
  pgvector:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: stationery_ai
      POSTGRES_USER: ${PGVECTOR_USERNAME:-stationery_ai}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?Set PGVECTOR_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - stationery_ai_vectors:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d stationery_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  stationery_ai_vectors:
