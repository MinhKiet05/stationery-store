spring.application.name=backend

# Main PostgreSQL database. DATABASE_URL must be a JDBC URL (jdbc:postgresql://...).
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=SET search_path TO store, extensions, public

# A private business schema avoids mixing managed migrations with old public vectors.
spring.flyway.schemas=store
spring.flyway.default-schema=store
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=store
# Measured mapper N+1 paths (images, catalog collections, orders/returns) share bounded lazy batches.
# This never JOIN FETCHes a collection into a paged root query.
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# Server
server.port=${PORT:10000}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Optional mail availability must not prevent Render's health check.
management.health.mail.enabled=false

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=stationery-store
app.jwt.expires-minutes=60

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${SMTP_FROM:${SMTP_USERNAME}}
app.frontend.url=${FRONTEND_URL:https://stationery-store-nu.vercel.app}
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:${app.frontend.url}/reset-password}

# Optional Gemini AI. The vector pool is separate, even when using the same project.
app.ai.enabled=${AI_ENABLED:false}
app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.chat-model=${GEMINI_CHAT_MODEL:gemini-2.5-flash-lite}
app.ai.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
app.ai.embedding-dimensions=${GEMINI_EMBEDDING_DIMENSIONS:3072}
app.ai.vector-url=${PGVECTOR_URL:${DATABASE_URL:}}
app.ai.vector-username=${PGVECTOR_USERNAME:${DB_USERNAME:}}
app.ai.vector-password=${PGVECTOR_PASSWORD:${DB_PASSWORD:}}
app.ai.vector-table=${PGVECTOR_TABLE:stationery_vectors_gemini}
app.ai.timeout=${AI_TIMEOUT:30s}
app.ai.vector-timeout=${AI_VECTOR_TIMEOUT:5s}
app.ai.view-weight=${AI_VIEW_WEIGHT:1}
app.ai.cart-weight=${AI_CART_WEIGHT:3}
app.ai.purchase-weight=${AI_PURCHASE_WEIGHT:5}
app.ai.half-life-days=${AI_HALF_LIFE_DAYS:30}
app.ai.history-days=${AI_HISTORY_DAYS:180}
app.ai.chat-requests-per-minute=${AI_CHAT_REQUESTS_PER_MINUTE:10}
app.ai.index-delay-ms=${AI_INDEX_DELAY_MS:60000}
app.tracking.view-cooldown-seconds=${TRACKING_VIEW_COOLDOWN_SECONDS:300}
