spring.application.name=backend

# SQL Server
spring.datasource.url=${SQLSERVER_URL:jdbc:sqlserver://localhost:1433;databaseName=stationery_shop;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SQLSERVER_USERNAME:sa}
spring.datasource.password=${SQLSERVER_PASSWORD:sapassword}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Server
server.port=8080

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=stationery-store
app.jwt.expires-minutes=60

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${SMTP_FROM:${SMTP_USERNAME}}
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}

# Optional local AI. SQL Server remains the only managed JPA datasource.
app.ai.enabled=${AI_ENABLED:false}
app.ai.ollama-url=${OLLAMA_URL:http://localhost:11434}
app.ai.chat-model=${OLLAMA_CHAT_MODEL:qwen3:1.7b}
app.ai.embedding-model=${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
app.ai.vector-url=${PGVECTOR_URL:jdbc:postgresql://localhost:5433/stationery_ai}
app.ai.vector-username=${PGVECTOR_USERNAME:stationery_ai}
app.ai.vector-password=${PGVECTOR_PASSWORD:}
app.ai.vector-table=${PGVECTOR_TABLE:stationery_vectors}
app.ai.timeout=${AI_TIMEOUT:30s}
app.ai.vector-timeout=${AI_VECTOR_TIMEOUT:5s}
app.ai.view-weight=${AI_VIEW_WEIGHT:1}
app.ai.cart-weight=${AI_CART_WEIGHT:3}
app.ai.purchase-weight=${AI_PURCHASE_WEIGHT:5}
app.ai.half-life-days=${AI_HALF_LIFE_DAYS:30}
app.ai.history-days=${AI_HISTORY_DAYS:180}
app.ai.chat-requests-per-minute=${AI_CHAT_REQUESTS_PER_MINUTE:10}
app.ai.index-delay-ms=${AI_INDEX_DELAY_MS:60000}
app.tracking.view-cooldown-seconds=${TRACKING_VIEW_COOLDOWN_SECONDS:300}
