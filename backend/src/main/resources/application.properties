spring.application.name=backend

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=stationery_shop;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sapassword
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Server
server.port=8080

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=stationery-store
app.jwt.expires-minutes=60
